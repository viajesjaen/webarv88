<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Local · Registro</title><link rel="stylesheet" href="../styles.css"></head><body><main class="shell admin-shell"><header><div><span class="eyebrow">AR LOCAL</span><h1>Acceso de propietarios</h1><p>Crea tu cuenta para que el administrador pueda asignarte tu establecimiento.</p></div><a class="ghost" href="../">Inicio</a></header><section class="panel"><form id="registerForm" class="form"><label class="full">Nombre<input id="name" required></label><label class="full">Email<input id="email" type="email" required></label><label class="full">Contraseña<input id="password" type="password" minlength="6" required></label><button class="primary full">Crear cuenta</button></form><p id="msg" class="diagnostic"></p><p><a href="./">Volver al acceso</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>const cfg=window.APP_CONFIG||{};const sb=window.supabase?.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');const {error}=await sb.auth.signUp({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,options:{data:{full_name:document.getElementById('name').value.trim()}}});msg.textContent=error?error.message:'Cuenta creada. Si Supabase solicita confirmar el email, hazlo y después comunica tu email al administrador para que te asigne el establecimiento.'});</script></body></html>
